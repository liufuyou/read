name: sources-check

# 校验已提交的书源文件：类型、分组、地址、重复。
# 不联网，只查仓库里的东西，防止手改或合并出错。

on:
  push:
    paths:
      - "sources/**"
      - "scripts/build_sources.py"
      - "import/**"
  pull_request:
    paths:
      - "sources/**"
      - "scripts/build_sources.py"
      - "import/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验书源文件
        run: python scripts/build_sources.py --check
